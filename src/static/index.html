<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREMOR — Mantle Observability Engine</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --panel-bg: #181f2c;
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      
      /* High-contrast colors for colorblind accessibility */
      --accent-cyan: #38bdf8;
      --user-bg: rgba(236, 72, 153, 0.12);
      --user-border: #f43f5e;
      --user-text: #fb7185;
      
      --bot-bg: rgba(14, 165, 233, 0.12);
      --bot-border: #38bdf8;
      --bot-text: #38bdf8;
      
      --system-bg: rgba(148, 163, 184, 0.08);
      --system-border: #64748b;
      
      --accent-amber: #fbbf24;
      --accent-green: #4ade80;
      --accent-rose: #f43f5e;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(24, 31, 44, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #f43f5e, var(--accent-cyan));
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .top-nav {
      display: flex;
      gap: 8px;
    }

    .top-nav-item {
      padding: 8px 16px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .top-nav-item:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .top-nav-item.active {
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .dot.connecting {
      background-color: var(--accent-amber);
      box-shadow: 0 0 8px var(--accent-amber);
    }

    .dot.disconnected {
      background-color: var(--accent-rose);
      box-shadow: 0 0 8px var(--accent-rose);
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .sidebar-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .filter-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .filter-btn.active-error {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border-color: var(--accent-rose);
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 30px 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 50%;
      transition: color 0.15s ease;
    }

    .search-clear-btn:hover {
      color: var(--text-main);
    }

    .search-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0b0e14;
      position: relative;
    }

    .log-stream {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .log-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 18px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s ease;
    }

    .log-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    .log-model {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .log-latency {
      color: var(--accent-amber);
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .role-user {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-left: 4px solid var(--user-border);
      color: #fce7f3;
    }

    .role-assistant {
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      border-left: 4px solid var(--bot-border);
      color: #e0f2fe;
    }

    .role-system {
      background: var(--system-bg);
      border: 1px solid var(--system-border);
      border-left: 4px solid var(--system-border);
      color: #cbd5e1;
      font-size: 0.82rem;
    }

    .role-tool {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid var(--accent-amber);
      border-left: 4px solid var(--accent-amber);
      color: #fef08a;
    }

    .error-banner {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid var(--accent-rose);
      color: #fecdd3;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 600;
    }

    .thinking-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.83rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--font-mono);
    }

    .collapsible-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .collapsible-header:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .token-badge {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .token-bar {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      flex-wrap: wrap;
    }

    .beads-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    .svg-viewport {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      overflow: auto;
      position: relative;
    }

    .stats-overlay {
      position: absolute;
      top: 32px;
      right: 32px;
      background: rgba(24, 31, 44, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: var(--text-main);
      display: flex;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 5;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-val {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent-cyan);
    }

    .stat-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .node-drawer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 420px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      padding: 20px;
      overflow-y: auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.6';
    import { useState, useEffect, useMemo } from 'https://esm.sh/preact@10.19.6/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    function estimateTokens(text) {
      if (!text) return 0;
      return Math.ceil(text.length / 4);
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const time = d.toTimeString().split(' ')[0];
      return `${year}-${month}-${day} ${time}`;
    }

    function LogCard({ log, viewMode }) {
      const [showSystem, setShowSystem] = useState(false);
      const [showThinking, setShowThinking] = useState(false);

      const promptMsgs = log.prompt || [];
      const userMsgs = promptMsgs.filter(m => m.role === 'user');
      const systemMsgs = promptMsgs.filter(m => m.role === 'system');
      const systemText = systemMsgs.map(m => m.content).join("\n\n");
      const systemTokens = estimateTokens(systemText);

      const botOutput = log.raw_output?.content || '';
      const thinking = log.raw_output?.thinking || '';
      const thinkingTokens = estimateTokens(thinking);
      const toolCalls = log.raw_output?.tool_calls || null;
      const errorMessage = log.error_message || null;

      const renderUser = viewMode === 'all' || viewMode === 'interleaved' || viewMode === 'user';
      const renderBot = viewMode === 'all' || viewMode === 'interleaved' || viewMode === 'bot';
      const renderTools = viewMode === 'all' || viewMode === 'interleaved' || viewMode === 'tools';

      return html`
        <div class="log-card">
          <div class="log-header">
            <span>Call ID: ${log.id ? log.id.slice(0, 8) : 'N/A'}</span>
            <span class="log-model">${log.model || 'Unknown Model'}</span>
            <span>📅 ${formatDate(log.timestamp)}</span>
            <span class="log-latency">⚡ ${log.latency_ms ? log.latency_ms + 'ms' : ''}</span>
          </div>

          ${errorMessage && html`
            <div class="error-banner">
              ⚠️ <strong>Error:</strong> ${errorMessage}
            </div>
          `}

          ${systemMsgs.length > 0 && html`
            <div>
              <div class="collapsible-header" onClick=${() => setShowSystem(!showSystem)}>
                <span>⚙️ System Prompt Context (${systemMsgs.length} block${systemMsgs.length > 1 ? 's' : ''})</span>
                <div style="display:flex; gap:8px; align-items:center;">
                  <span class="token-badge">~${systemTokens} tokens</span>
                  <span>${showSystem ? '▼ Hide' : '▶ Expand'}</span>
                </div>
              </div>
              ${showSystem && systemMsgs.map((m, idx) => html`
                <div class="message-bubble role-system" key=${idx} style="margin-top:8px;">
                  ${m.content}
                </div>
              `)}
            </div>
          `}

          ${renderUser && userMsgs.map((m, idx) => html`
            <div key=${idx}>
              <div style="font-size:0.75rem; color:var(--user-text); font-weight:800; margin-bottom:6px; letter-spacing:0.5px;">👤 USER INPUT (~${estimateTokens(m.content)} tokens)</div>
              <div class="message-bubble role-user">
                ${m.content}
              </div>
            </div>
          `)}

          ${thinking && html`
            <div>
              <div class="collapsible-header" onClick=${() => setShowThinking(!showThinking)}>
                <span>🧠 Model Reasoning / Thinking</span>
                <div style="display:flex; gap:8px; align-items:center;">
                  <span class="token-badge">~${thinkingTokens} tokens</span>
                  <span>${showThinking ? '▼ Hide' : '▶ Expand'}</span>
                </div>
              </div>
              ${showThinking && html`
                <div class="thinking-box" style="margin-top:8px;">
                  ${thinking}
                </div>
              `}
            </div>
          `}

          ${renderBot && (botOutput || (!thinking && !toolCalls)) && html`
            <div>
              <div style="font-size:0.75rem; color:var(--bot-text); font-weight:800; margin-bottom:6px; letter-spacing:0.5px;">🤖 BOT RESPONSE (~${estimateTokens(botOutput)} tokens)</div>
              <div class="message-bubble role-assistant">
                ${botOutput ? botOutput : html`<span style="color:var(--text-muted); font-style:italic;">(No text content in response)</span>`}
              </div>
            </div>
          `}

          ${renderTools && toolCalls && html`
            <div>
              <div style="font-size:0.75rem; color:var(--accent-amber); font-weight:800; margin-bottom:6px; letter-spacing:0.5px;">🛠️ TOOL CALLS GENERATED</div>
              <div class="message-bubble role-tool">
                ${JSON.stringify(toolCalls, null, 2)}
              </div>
            </div>
          `}

          <div class="token-bar">
            <span>Status: <strong style="color:${log.status === 'success' ? 'var(--accent-green)' : 'var(--accent-rose)'}">${log.status || 'unknown'}</strong></span>
            ${log.sequence_id ? html`<span>Seq ID: ${log.sequence_id.slice(0, 8)}</span>` : null}
            ${log.input_hash ? html`<span>Prompt Hash: ${log.input_hash.slice(0, 8)}</span>` : null}
          </div>
        </div>
      `;
    }

    function BeadsView({ token }) {
      const [nodes, setNodes] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [nodeDetails, setNodeDetails] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`/api/thread?token=${encodeURIComponent(token)}`)
          .then(res => res.json())
          .then(data => {
            setNodes(data);
            setLoading(false);
          })
          .catch(err => console.error("Failed to load thread skeleton:", err));
      }, [token]);

      const inspectNode = (nodeId) => {
        setSelectedNode(nodeId);
        fetch(`/api/node/${encodeURIComponent(nodeId)}?token=${encodeURIComponent(token)}`)
          .then(res => res.json())
          .then(data => setNodeDetails(data))
          .catch(err => console.error("Failed to load node payload:", err));
      };

      if (loading) {
        return html`<div style="padding:40px; color:var(--text-muted); text-align:center;">Loading thread skeleton graph...</div>`;
      }

      if (nodes.length === 0) {
        return html`<div style="padding:40px; color:var(--text-muted); text-align:center;">No context node graph found.</div>`;
      }

      // Summary Statistics Calculations
      const totalNodes = nodes.length;
      const uniqueSequences = new Set(nodes.map(n => n.sequence_id || n.turn_id).filter(Boolean));
      const totalTokens = nodes.reduce((sum, n) => sum + (n.token_count || 0), 0);
      const toolNodesCount = nodes.filter(n => n.has_tools || n.role === 'tool').length;

      const nodeCoords = {};
      const nodeIndexMap = {};
      nodes.forEach((n, idx) => { nodeIndexMap[n.id] = idx; });

      let spineX = 60;
      const layoutNodes = nodes.map((node, i) => {
        const isBranch = node.parent_id && nodeIndexMap[node.parent_id] !== undefined && nodeIndexMap[node.parent_id] < i - 1;
        const x = isBranch ? (nodeCoords[node.parent_id]?.x || 60) + 40 : spineX;
        const y = isBranch ? 60 : 130;
        
        if (!isBranch) spineX += 110;
        
        nodeCoords[node.id] = { x, y };
        return { ...node, x, y, isBranch };
      });

      // Group layout nodes by sequence_id for visual boundaries
      const seqGroups = {};
      layoutNodes.forEach(n => {
        const seqKey = n.sequence_id || n.turn_id || 'unbound';
        if (!seqGroups[seqKey]) seqGroups[seqKey] = [];
        seqGroups[seqKey].push(n);
      });

      const svgWidth = Math.max(900, spineX + 120);

      return html`
        <div class="beads-container">
          <div class="stats-overlay">
            <div class="stat-item">
              <span class="stat-val">${totalNodes}</span>
              <span class="stat-lbl">Total Nodes</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" style="color:var(--accent-amber);">${uniqueSequences.size}</span>
              <span class="stat-lbl">Sequences</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" style="color:var(--accent-green);">${toolNodesCount}</span>
              <span class="stat-lbl">Tool Calls</span>
            </div>
            <div class="stat-item">
              <span class="stat-val">~${totalTokens}</span>
              <span class="stat-lbl">Context Tokens</span>
            </div>
          </div>

          <div style="margin-bottom:12px; font-size:0.85rem; color:var(--text-muted);">
            Linear Spine & Sequence Boundaries — Click any bead hash to inspect payload.
          </div>

          <div class="svg-viewport">
            <svg width="${svgWidth}" height="280" style="min-width:100%;">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
                </marker>
              </defs>

              <!-- Sequence Grouping Boundary Pods -->
              ${Object.entries(seqGroups).map(([seqKey, seqNodes]) => {
                if (seqNodes.length === 0) return null;
                const minX = Math.min(...seqNodes.map(n => n.x)) - 25;
                const maxX = Math.max(...seqNodes.map(n => n.x)) + 25;
                const width = Math.max(70, maxX - minX);
                const shortSeq = seqKey.slice(0, 8);

                return html`
                  <g key="${seqKey}">
                    <rect 
                      x="${minX}" y="35" width="${width}" height="190" rx="12" 
                      fill="rgba(255, 255, 255, 0.02)" 
                      stroke="rgba(255, 255, 255, 0.08)" 
                      stroke-dasharray="3 3"
                    />
                    <text 
                      x="${minX + 8}" y="50" 
                      fill="rgba(148, 163, 184, 0.5)" 
                      font-size="9" 
                      font-family="monospace"
                      font-weight="700"
                    >
                      SEQ #${shortSeq}
                    </text>
                  </g>
                `;
              })}

              <!-- Parent-Child Connections -->
              ${layoutNodes.map(node => {
                if (!node.parent_id || !nodeCoords[node.parent_id]) return null;
                const parent = nodeCoords[node.parent_id];
                return html`
                  <line 
                    x1="${parent.x}" y1="${parent.y}" 
                    x2="${node.x}" y2="${node.y}" 
                    stroke="${node.isBranch ? '#fbbf24' : '#38bdf8'}" 
                    stroke-width="2" 
                    stroke-dasharray="${node.isBranch ? '4 4' : 'none'}"
                    marker-end="url(#arrow)"
                  />
                `;
              })}

              <!-- Subsumption Links -->
              ${layoutNodes.map(node => {
                if (!node.subsumes || node.subsumes.length === 0) return null;
                return node.subsumes.map(subId => {
                  const target = nodeCoords[subId];
                  if (!target) return null;
                  return html`
                    <line 
                      x1="${node.x}" y1="${node.y}" 
                      x2="${target.x}" y2="${target.y}" 
                      stroke="#fbbf24" 
                      stroke-width="1.5" 
                      stroke-dasharray="3 3"
                    />
                  `;
                });
              })}

              <!-- Bead Nodes -->
              ${layoutNodes.map(node => {
                const isSelected = selectedNode === node.id;
                const isSquish = node.subsumes && node.subsumes.length > 0;
                const hasTools = node.has_tools || node.role === "tool";
                
                // High-contrast accessibility palette:
                // User = Rose (#f43f5e)
                // Assistant = Cyan (#38bdf8)
                // Tool = Amber (#fbbf24)
                // System = Purple (#c084fc)
                let fillColor = "#c084fc";
                if (node.role === "user") fillColor = "#f43f5e";
                if (node.role === "assistant") fillColor = "#38bdf8";
                if (node.role === "tool" || hasTools) fillColor = "#fbbf24";
                if (isSquish) fillColor = "#4ade80";

                const shortHash = node.id ? node.id.slice(0, 8) : 'node';

                return html`
                  <g 
                    key="${node.id}" 
                    onClick=${() => inspectNode(node.id)} 
                    style="cursor:pointer;"
                  >
                    <!-- Tool Wrench Indicator -->
                    ${hasTools && html`
                      <text 
                        x="${node.x}" y="${node.y - 22}" 
                        font-size="14" 
                        text-anchor="middle"
                      >
                        🔧
                      </text>
                    `}

                    <!-- Outer Ring -->
                    <circle 
                      cx="${node.x}" cy="${node.y}" r="${isSelected ? 18 : 14}" 
                      fill="${fillColor}" 
                      fill-opacity="0.25"
                      stroke="${fillColor}" 
                      stroke-width="${isSelected ? 3 : 2}"
                      stroke-dasharray="${isSquish ? '3 3' : 'none'}"
                    />
                    <!-- Inner Core -->
                    <circle cx="${node.x}" cy="${node.y}" r="5" fill="${fillColor}" />
                    
                    <!-- Short Hash Label -->
                    <text 
                      x="${node.x}" y="${node.y + 28}" 
                      fill="#e2e8f0" 
                      font-size="10" 
                      text-anchor="middle" 
                      font-family="monospace"
                      font-weight="700"
                    >
                      ${shortHash}
                    </text>
                  </g>
                `;
              })}
            </svg>
          </div>

          ${selectedNode && html`
            <div class="node-drawer">
              <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--panel-border); padding-bottom:10px;">
                <span style="font-weight:700; font-size:1rem; color:var(--accent-cyan);">Node Payload Inspector</span>
                <button 
                  onClick=${() => setSelectedNode(null)} 
                  style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem;"
                >✕</button>
              </div>

              ${nodeDetails ? html`
                <div style="font-family:var(--font-mono); font-size:0.83rem; display:flex; flex-direction:column; gap:12px;">
                  <div><strong>Node ID:</strong> ${selectedNode}</div>
                  ${nodeDetails.sequence_id ? html`<div><strong>Sequence ID:</strong> ${nodeDetails.sequence_id}</div>` : null}
                  <div><strong>Role:</strong> <span style="color:var(--accent-cyan); font-weight:700;">${nodeDetails.message?.role || nodeDetails.role}</span></div>
                  <div><strong>Tokens:</strong> ~${nodeDetails.token_count || estimateTokens(nodeDetails.message?.content || '')}</div>
                  
                  ${nodeDetails.raw_output?.tool_calls && html`
                    <div>
                      <strong style="color:var(--accent-amber)">🔧 Tool Calls Executed:</strong>
                      <div class="message-bubble role-tool" style="margin-top:6px;">
                        ${JSON.stringify(nodeDetails.raw_output.tool_calls, null, 2)}
                      </div>
                    </div>
                  `}

                  <div>
                    <strong style="color:var(--accent-cyan)">Content Payload:</strong>
                    <div class="message-bubble role-assistant" style="margin-top:6px;">
                      ${nodeDetails.message?.content || nodeDetails.raw_output?.content || JSON.stringify(nodeDetails, null, 2)}
                    </div>
                  </div>
                </div>
              ` : html`<div style="color:var(--text-muted)">Loading payload...</div>`}
            </div>
          `}
        </div>
      `;
    }

    function App() {
      const [logs, setLogs] = useState([]);
      const [status, setStatus] = useState('connecting');
      const [activeTab, setActiveTab] = useState('ongoing');
      const [viewMode, setViewMode] = useState('interleaved');
      const [statusFilter, setStatusFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [maxRecords, setMaxRecords] = useState(250);

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || '';

      useEffect(() => {
        const eventSource = new EventSource(`/api/tail/llm_calls?token=${encodeURIComponent(token)}`);

        eventSource.onopen = () => setStatus('connected');
        eventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            setLogs(prev => [data, ...prev].slice(0, maxRecords));
          } catch (err) {
            console.error("Parse error:", err);
          }
        };
        eventSource.onerror = () => setStatus('disconnected');

        return () => eventSource.close();
      }, [maxRecords, token]);

      const filteredLogs = useMemo(() => {
        return logs.filter(log => {
          if (statusFilter === 'error' && log.status !== 'error' && !log.error_message) return false;
          if (statusFilter === 'success' && log.status !== 'success') return false;

          if (viewMode === 'tools') {
            const hasToolCalls = log.raw_output?.tool_calls && log.raw_output.tool_calls.length > 0;
            if (!hasToolCalls) return false;
          }
          if (viewMode === 'user') {
            const hasUserMsg = (log.prompt || []).some(m => m.role === 'user');
            if (!hasUserMsg) return false;
          }
          if (viewMode === 'bot') {
            const hasBotMsg = (log.raw_output?.content && log.raw_output.content.trim().length > 0) || (log.raw_output?.tool_calls && log.raw_output.tool_calls.length > 0);
            if (!hasBotMsg) return false;
          }

          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();

          const modelMatch = (log.model || '').toLowerCase().includes(q);
          const statusMatch = (log.status || '').toLowerCase().includes(q);
          const seqMatch = (log.sequence_id || '').toLowerCase().includes(q);
          const idMatch = (log.id || '').toLowerCase().includes(q);
          const errorMatch = (log.error_message || '').toLowerCase().includes(q);
          
          const promptMatch = (log.prompt || []).some(m => (m.content || '').toLowerCase().includes(q));
          const responseMatch = (log.raw_output?.content || '').toLowerCase().includes(q);
          const thinkingMatch = (log.raw_output?.thinking || '').toLowerCase().includes(q);

          return modelMatch || statusMatch || seqMatch || idMatch || errorMatch || promptMatch || responseMatch || thinkingMatch;
        });
      }, [logs, searchQuery, statusFilter, viewMode]);

      return html`
        <div style="display:flex; flex-direction:column; height:100vh;">
          <header>
            <div class="brand">
              <span>TREMOR</span>
              <span class="brand-badge">OBSERVABILITY ENGINE</span>
            </div>

            <nav class="top-nav">
              <div class="top-nav-item ${activeTab === 'ongoing' ? 'active' : ''}" onClick=${() => setActiveTab('ongoing')}>
                Ongoing Log
              </div>
              <div class="top-nav-item ${activeTab === 'beads' ? 'active' : ''}" onClick=${() => setActiveTab('beads')}>
                Beads Thread View
              </div>
            </nav>

            <div class="status-indicator">
              <div class="dot ${status}"></div>
              <span>${status.toUpperCase()} (${filteredLogs.length} / ${logs.length} calls)</span>
            </div>
          </header>
          
          <main>
            ${activeTab === 'ongoing' && html`
              <div class="sidebar">
                <div>
                  <div class="sidebar-section-title">View Slices</div>
                  <div class="filter-group">
                    <button class="filter-btn ${viewMode === 'interleaved' ? 'active' : ''}" onClick=${() => setViewMode('interleaved')}>
                      <span>Interleaved (Both)</span>
                    </button>
                    <button class="filter-btn ${viewMode === 'bot' ? 'active' : ''}" onClick=${() => setViewMode('bot')}>
                      <span>Bot Responses</span>
                    </button>
                    <button class="filter-btn ${viewMode === 'user' ? 'active' : ''}" onClick=${() => setViewMode('user')}>
                      <span>User Inputs</span>
                    </button>
                    <button class="filter-btn ${viewMode === 'tools' ? 'active' : ''}" onClick=${() => setViewMode('tools')}>
                      <span>Tool Calls Only</span>
                    </button>
                  </div>
                </div>

                <div>
                  <div class="sidebar-section-title">Execution Status</div>
                  <div class="filter-group">
                    <button class="filter-btn ${statusFilter === 'all' ? 'active' : ''}" onClick=${() => setStatusFilter('all')}>
                      <span>All Statuses</span>
                    </button>
                    <button class="filter-btn ${statusFilter === 'success' ? 'active' : ''}" onClick=${() => setStatusFilter('success')}>
                      <span>Success Only</span>
                    </button>
                    <button class="filter-btn ${statusFilter === 'error' ? 'active-error' : ''}" onClick=${() => setStatusFilter('error')}>
                      <span>Errors Only</span>
                    </button>
                  </div>
                </div>

                <div>
                  <div class="sidebar-section-title">Search Filter</div>
                  <div class="search-wrapper">
                    <input 
                      type="text" 
                      class="search-input" 
                      placeholder="Filter text, model, ID..." 
                      value=${searchQuery} 
                      onInput=${e => setSearchQuery(e.target.value)} 
                    />
                    ${searchQuery && html`
                      <button 
                        class="search-clear-btn" 
                        title="Clear search filter"
                        onClick=${() => setSearchQuery('')}
                      >
                        ✕
                      </button>
                    `}
                  </div>
                  <div class="search-hint">
                    Searches prompt text, model output, reasoning, sequence IDs, model names, and error messages.
                  </div>
                </div>

                <div>
                  <div class="sidebar-section-title">Max Buffer</div>
                  <select 
                    class="search-input" 
                    value=${maxRecords} 
                    onChange=${e => setMaxRecords(Number(e.target.value))}
                  >
                    <option value="100">100 Records</option>
                    <option value="250">250 Records</option>
                    <option value="500">500 Records</option>
                    <option value="1000">1000 Records</option>
                  </select>
                </div>
              </div>
            `}

            <div class="content-area">
              ${activeTab === 'ongoing' ? html`
                <div class="log-stream">
                  ${filteredLogs.length === 0 ? html`
                    <div style="text-align:center; padding:60px; color:var(--text-muted)">
                      <div style="font-size:1.1rem; font-weight:700; color:var(--text-main); margin-bottom:8px;">No matching records found</div>
                      <div style="font-size:0.85rem; max-width:400px; margin:0 auto; line-height:1.5;">
                        No logs matched your active filters.
                      </div>
                    </div>
                  ` : filteredLogs.map((log, idx) => html`
                    <${LogCard} key=${log.id || idx} log=${log} viewMode=${viewMode} />
                  `)}
                </div>
              ` : html`
                <${BeadsView} token=${token} />
              `}
            </div>
          </main>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
