<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantle Scope — Observability Layer</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --panel-bg: #181f2c;
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-amber: #fbbf24;
      --accent-green: #4ade80;
      --accent-rose: #f43f5e;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(24, 31, 44, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent-cyan), #818cf8);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .dot.connecting {
      background-color: var(--accent-amber);
      box-shadow: 0 0 8px var(--accent-amber);
    }

    .dot.disconnected {
      background-color: var(--accent-rose);
      box-shadow: 0 0 8px var(--accent-rose);
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 10px 14px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .nav-item.active {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0b0e14;
    }

    .log-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease;
    }

    .log-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    .log-model {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .log-latency {
      color: var(--accent-amber);
    }

    .log-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      color: #cbd5e1;
      max-height: 300px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 6px;
    }

    .token-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.6';
    import { useState, useEffect } from 'https://esm.sh/preact@10.19.6/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    function App() {
      const [logs, setLogs] = useState([]);
      const [status, setStatus] = useState('connecting');
      const [bytesReceived, setBytesReceived] = useState(0);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';

        const eventSource = new EventSource(`/api/tail/llm_calls?token=${encodeURIComponent(token)}`);

        eventSource.onopen = () => {
          setStatus('connected');
        };

        eventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            setLogs(prev => [data, ...prev].slice(0, 100));
            setBytesReceived(b => b + e.data.length);
          } catch (err) {
            console.error("Failed to parse log line:", err, e.data);
          }
        };

        eventSource.onerror = (err) => {
          setStatus('disconnected');
          console.error("SSE Error:", err);
        };

        return () => eventSource.close();
      }, []);

      return html`
        <div style="display:flex; flex-direction:column; height:100vh;">
          <header>
            <div class="brand">
              <span>MANTLE SCOPE</span>
              <span class="brand-badge">MVP</span>
            </div>
            <div class="status-indicator">
              <div class="dot ${status}"></div>
              <span>${status.toUpperCase()} (${logs.length} calls)</span>
            </div>
          </header>
          
          <main>
            <div class="sidebar">
              <div class="nav-item active">
                <span>LLM Calls</span>
                <span style="font-size:0.75rem; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:10px;">${logs.length}</span>
              </div>
              <div class="nav-item">
                <span>Topic Frames</span>
                <span style="font-size:0.75rem; color:var(--text-muted)">Phase 2</span>
              </div>
              <div class="nav-item">
                <span>Memory Layers</span>
                <span style="font-size:0.75rem; color:var(--text-muted)">Phase 2</span>
              </div>
            </div>

            <div class="content-area">
              <div class="log-stream">
                ${logs.length === 0 ? html`
                  <div style="text-align:center; padding:40px; color:var(--text-muted)">
                    Waiting for incoming LLM calls from <code>llm_calls.jsonl</code>...
                  </div>
                ` : logs.map((log, idx) => html`
                  <div class="log-card" key=${log.id || idx}>
                    <div class="log-header">
                      <span>ID: ${log.id ? log.id.slice(0, 8) : 'N/A'}</span>
                      <span class="log-model">${log.model || 'Unknown Model'}</span>
                      <span>${log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : ''}</span>
                      <span class="log-latency">${log.latency_ms ? log.latency_ms + 'ms' : ''}</span>
                    </div>

                    <div class="log-content">
                      ${log.raw_output && log.raw_output.content 
                        ? log.raw_output.content 
                        : (log.prompt && log.prompt.length > 0 ? log.prompt[log.prompt.length - 1].content : JSON.stringify(log, null, 2))}
                    </div>

                    <div class="token-bar">
                      <span>Status: <strong style="color:${log.status === 'success' ? 'var(--accent-green)' : 'var(--accent-rose)'}">${log.status || 'unknown'}</strong></span>
                      ${log.sequence_id ? html`<span>Seq: ${log.sequence_id.slice(0, 8)}</span>` : null}
                    </div>
                  </div>
                `)}
              </div>
            </div>
          </main>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
