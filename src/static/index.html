<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantle Scope — Observability Layer</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --panel-bg: #181f2c;
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-amber: #fbbf24;
      --accent-green: #4ade80;
      --accent-purple: #c084fc;
      --accent-rose: #f43f5e;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(24, 31, 44, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent-cyan), #818cf8);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .dot.connecting {
      background-color: var(--accent-amber);
      box-shadow: 0 0 8px var(--accent-amber);
    }

    .dot.disconnected {
      background-color: var(--accent-rose);
      box-shadow: 0 0 8px var(--accent-rose);
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 10px 14px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .nav-item.active {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0b0e14;
    }

    .toolbar {
      padding: 12px 24px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(24, 31, 44, 0.5);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    .search-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      width: 220px;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    .log-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .log-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease;
    }

    .log-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    .log-model {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .log-latency {
      color: var(--accent-amber);
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .role-user {
      background: rgba(192, 132, 252, 0.1);
      border-left: 3px solid var(--accent-purple);
    }

    .role-assistant {
      background: rgba(56, 189, 248, 0.1);
      border-left: 3px solid var(--accent-cyan);
    }

    .role-system {
      background: rgba(100, 116, 139, 0.1);
      border-left: 3px solid var(--text-muted);
      color: #94a3b8;
      font-size: 0.78rem;
    }

    .role-tool {
      background: rgba(251, 191, 36, 0.1);
      border-left: 3px solid var(--accent-amber);
    }

    .thinking-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.8rem;
      color: #94a3b8;
      font-style: italic;
    }

    .collapsible-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .collapsible-header:hover {
      color: var(--text-main);
    }

    .token-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.6';
    import { useState, useEffect, useMemo } from 'https://esm.sh/preact@10.19.6/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    function LogCard({ log, viewMode }) {
      const [showSystem, setShowSystem] = useState(false);
      const [showThinking, setShowThinking] = useState(false);

      // Extract user prompt messages vs system vs assistant
      const promptMsgs = log.prompt || [];
      const userMsgs = promptMsgs.filter(m => m.role === 'user');
      const systemMsgs = promptMsgs.filter(m => m.role === 'system');
      const toolMsgs = promptMsgs.filter(m => m.role === 'tool' || m.role === 'function');
      
      const botOutput = log.raw_output?.content || '';
      const thinking = log.raw_output?.thinking || '';
      const toolCalls = log.raw_output?.tool_calls || null;

      // Filter rendering based on selected slice/viewMode
      const renderUser = viewMode === 'all' || viewMode === 'interleaved' || viewMode === 'user';
      const renderBot = viewMode === 'all' || viewMode === 'interleaved' || viewMode === 'bot';
      const renderTools = viewMode === 'all' || viewMode === 'tools';

      return html`
        <div class="log-card">
          <div class="log-header">
            <span>Call ID: ${log.id ? log.id.slice(0, 8) : 'N/A'}</span>
            <span class="log-model">${log.model || 'Unknown Model'}</span>
            <span>${log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : ''}</span>
            <span class="log-latency">${log.latency_ms ? log.latency_ms + 'ms' : ''}</span>
          </div>

          ${systemMsgs.length > 0 && html`
            <div>
              <div class="collapsible-header" onClick=${() => setShowSystem(!showSystem)}>
                <span>⚙️ System Prompt (${systemMsgs.length} block${systemMsgs.length > 1 ? 's' : ''})</span>
                <span>${showSystem ? '▼ Hide' : '▶ Expand'}</span>
              </div>
              ${showSystem && systemMsgs.map((m, idx) => html`
                <div class="message-bubble role-system" key=${idx} style="margin-top:6px;">
                  ${m.content}
                </div>
              `)}
            </div>
          `}

          ${renderUser && userMsgs.map((m, idx) => html`
            <div>
              <div style="font-size:0.75rem; color:var(--accent-purple); font-weight:700; margin-bottom:4px;">👤 USER INPUT</div>
              <div class="message-bubble role-user" key=${idx}>
                ${m.content}
              </div>
            </div>
          `)}

          ${thinking && html`
            <div>
              <div class="collapsible-header" onClick=${() => setShowThinking(!showThinking)}>
                <span>🧠 Model Reasoning / Thinking</span>
                <span>${showThinking ? '▼ Hide' : '▶ Expand'}</span>
              </div>
              ${showThinking && html`
                <div class="thinking-box" style="margin-top:6px;">
                  ${thinking}
                </div>
              `}
            </div>
          `}

          ${renderBot && botOutput && html`
            <div>
              <div style="font-size:0.75rem; color:var(--accent-cyan); font-weight:700; margin-bottom:4px;">🤖 BOT RESPONSE</div>
              <div class="message-bubble role-assistant">
                ${botOutput}
              </div>
            </div>
          `}

          ${renderTools && toolCalls && html`
            <div>
              <div style="font-size:0.75rem; color:var(--accent-amber); font-weight:700; margin-bottom:4px;">🛠️ TOOL CALLS</div>
              <div class="message-bubble role-tool">
                ${JSON.stringify(toolCalls, null, 2)}
              </div>
            </div>
          `}

          <div class="token-bar">
            <span>Status: <strong style="color:${log.status === 'success' ? 'var(--accent-green)' : 'var(--accent-rose)'}">${log.status || 'unknown'}</strong></span>
            ${log.sequence_id ? html`<span>Seq: ${log.sequence_id.slice(0, 8)}</span>` : null}
            ${log.input_hash ? html`<span>Hash: ${log.input_hash.slice(0, 8)}</span>` : null}
          </div>
        </div>
      `;
    }

    function App() {
      const [logs, setLogs] = useState([]);
      const [status, setStatus] = useState('connecting');
      const [viewMode, setViewMode] = useState('interleaved'); // 'interleaved', 'bot', 'user', 'tools'
      const [searchQuery, setSearchQuery] = useState('');

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';

        const eventSource = new EventSource(`/api/tail/llm_calls?token=${encodeURIComponent(token)}`);

        eventSource.onopen = () => setStatus('connected');

        eventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            setLogs(prev => [data, ...prev].slice(0, 100));
          } catch (err) {
            console.error("Parse error:", err);
          }
        };

        eventSource.onerror = (err) => {
          setStatus('disconnected');
        };

        return () => eventSource.close();
      }, []);

      const filteredLogs = useMemo(() => {
        if (!searchQuery.trim()) return logs;
        const q = searchQuery.toLowerCase();
        return logs.filter(log => {
          const contentStr = JSON.stringify(log).toLowerCase();
          return contentStr.includes(q);
        });
      }, [logs, searchQuery]);

      return html`
        <div style="display:flex; flex-direction:column; height:100vh;">
          <header>
            <div class="brand">
              <span>MANTLE SCOPE</span>
              <span class="brand-badge">PROTOTYPE</span>
            </div>
            <div class="status-indicator">
              <div class="dot ${status}"></div>
              <span>${status.toUpperCase()} (${filteredLogs.length} / ${logs.length} calls)</span>
            </div>
          </header>
          
          <main>
            <div class="sidebar">
              <div class="nav-item active">
                <span>LLM Calls</span>
                <span style="font-size:0.75rem; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:10px;">${logs.length}</span>
              </div>
              <div class="nav-item">
                <span>Beads Thread View</span>
                <span style="font-size:0.75rem; color:var(--text-muted)">Phase 3</span>
              </div>
              <div class="nav-item">
                <span>Topic Frames</span>
                <span style="font-size:0.75rem; color:var(--text-muted)">Phase 2</span>
              </div>
            </div>

            <div class="content-area">
              <div class="toolbar">
                <span style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Slices:</span>
                <button class="filter-btn ${viewMode === 'interleaved' ? 'active' : ''}" onClick=${() => setViewMode('interleaved')}>Interleaved (Both)</button>
                <button class="filter-btn ${viewMode === 'bot' ? 'active' : ''}" onClick=${() => setViewMode('bot')}>Bot Responses</button>
                <button class="filter-btn ${viewMode === 'user' ? 'active' : ''}" onClick=${() => setViewMode('user')}>User Inputs</button>
                <button class="filter-btn ${viewMode === 'tools' ? 'active' : ''}" onClick=${() => setViewMode('tools')}>Tool Calls</button>
                
                <input 
                  type="text" 
                  class="search-input" 
                  placeholder="Filter logs by keyword..." 
                  value=${searchQuery} 
                  onInput=${e => setSearchQuery(e.target.value)} 
                />
              </div>

              <div class="log-stream">
                ${filteredLogs.length === 0 ? html`
                  <div style="text-align:center; padding:40px; color:var(--text-muted)">
                    No log records matching filter...
                  </div>
                ` : filteredLogs.map((log, idx) => html`
                  <${LogCard} key=${log.id || idx} log=${log} viewMode=${viewMode} />
                `)}
              </div>
            </div>
          </main>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
